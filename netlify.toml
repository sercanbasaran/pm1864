[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "postgres"]

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Public product cards must also load when opened directly from a QR code.
[[redirects]]
  from = "/p/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kategori/*"
  to = "/index.html"
  status = 200
